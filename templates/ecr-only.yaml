# Creates only the 3 ECR repos. Deploy this first if the main stack failed before creating repos.
# After deploy: push base images (see README), then deploy/update the main stack.

AWSTemplateFormatVersion: "2010-09-09"
Description: AI Cloud Agent - ECR repositories only (bootstrap before main stack).

Parameters:
  Environment:
    Type: String
    Default: sandbox
    AllowedValues: [sandbox, dev, prod]
    Description: Environment name; must match main stack.

Resources:
  SupervisorRepo:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub "ai-cloud-agent-${Environment}-supervisor"
      LifecyclePolicy:
        LifecyclePolicyText: |
          {"rules":[{"rulePriority":1,"description":"Keep last 5 images","selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":5},"action":{"type":"expire"}}]}
  CostAgentRepo:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub "ai-cloud-agent-${Environment}-cost-agent"
      LifecyclePolicy:
        LifecyclePolicyText: |
          {"rules":[{"rulePriority":1,"description":"Keep last 5 images","selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":5},"action":{"type":"expire"}}]}
  SecurityAgentRepo:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub "ai-cloud-agent-${Environment}-security-agent"
      LifecyclePolicy:
        LifecyclePolicyText: |
          {"rules":[{"rulePriority":1,"description":"Keep last 5 images","selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":5},"action":{"type":"expire"}}]}

Outputs:
  SupervisorRepoUri:
    Value: !Sub "${SupervisorRepo}:latest"
  CostAgentRepoUri:
    Value: !Sub "${CostAgentRepo}:latest"
  SecurityAgentRepoUri:
    Value: !Sub "${SecurityAgentRepo}:latest"
