name: Deploy to CloudFormation

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  STACK_NAME: ai-cloud-agent-sandbox
  BUCKET_NAME: ai-cloud-agent-sandbox-deployments-503532613196
  S3_PREFIX: ai-cloud-agent/sandbox

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        if: ${{ vars.USE_OIDC == 'true' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION || env.AWS_REGION }}

      - name: Configure AWS credentials (Access keys)
        if: ${{ vars.USE_OIDC != 'true' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || env.AWS_REGION }}

      - name: Build and upload Lambda packages
        run: |
          mkdir -p build
          cd src/supervisor && zip -r ../../build/supervisor.zip *.py && cd ../..
          cd src/agents/cost && zip -r ../../../build/cost-agent.zip *.py && cd ../../..
          cd src/agents/security && zip -r ../../../build/security-agent.zip *.py && cd ../../..
          aws s3 cp build/supervisor.zip s3://${{ env.BUCKET_NAME }}/${{ env.S3_PREFIX }}/supervisor.zip --sse AES256
          aws s3 cp build/cost-agent.zip s3://${{ env.BUCKET_NAME }}/${{ env.S3_PREFIX }}/cost-agent.zip --sse AES256
          aws s3 cp build/security-agent.zip s3://${{ env.BUCKET_NAME }}/${{ env.S3_PREFIX }}/security-agent.zip --sse AES256

      - name: Deploy CloudFormation stack
        run: |
          aws cloudformation deploy \
            --template-file templates/main.yaml \
            --stack-name ${{ env.STACK_NAME }} \
            --parameter-overrides \
              Environment=sandbox \
              SenderEmail="khanhamza2293@gmail.com" \
              RecipientEmails="hamza.khan@nscorp.com" \
              AccountAlias=sandbox \
              BedrockModelId="anthropic.claude-3-5-sonnet-v2:0" \
              DeploymentBucketName=${{ env.BUCKET_NAME }} \
              SupervisorS3Key=${{ env.S3_PREFIX }}/supervisor.zip \
              CostAgentS3Key=${{ env.S3_PREFIX }}/cost-agent.zip \
              SecurityAgentS3Key=${{ env.S3_PREFIX }}/security-agent.zip \
            --no-fail-on-empty-changeset \
            --capabilities CAPABILITY_NAMED_IAM
